name: Fork Release
run-name: Publish ${{ github.ref_name }} 🛫
on:
  push:
    branches:
      - 'publish/**'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    name: Publish Release 🛫
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Push run whose builds are published
      BUILD_RUN_ID: '39542105143'
      TARGET_SHA: 6be25096176552f319584fa59c57f2aa543f0a8a
      RELEASE_TAG: 33.0.0-rc3-multistream2
      RELEASE_TITLE: OBS Studio 33.0.0-rc3 with Multistreaming and Chat
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Wait for Builds ⏳
        run: |
          : Wait for Builds ⏳
          set -euo pipefail
          until [[ "$(gh run view "${BUILD_RUN_ID}" --json status --jq .status)" == completed ]]; do
            sleep 30
          done

      - name: Download Build Artifacts 📥
        run: |
          : Download Build Artifacts 📥
          set -euo pipefail
          hash="${TARGET_SHA:0:9}"
          gh run download "${BUILD_RUN_ID}" --dir artifacts \
            --name "obs-studio-windows-x64-${hash}" \
            --name "obs-studio-macos-arm64-${hash}"
          find artifacts -type f

      - name: Collect Release Files 🏷️
        run: |
          : Collect Release Files 🏷️
          set -euo pipefail
          mkdir release

          collect() {
            local pattern="${1}"
            local name="${2}"
            local files
            mapfile -t files < <(find artifacts -type f -name "${pattern}")
            if (( ${#files[@]} != 1 )); then
              echo "::error::Expected one file matching ${pattern}, found ${#files[@]}"
              exit 1
            fi
            cp -v "${files[0]}" "release/OBS-Studio-${RELEASE_TAG}-${name}"
          }

          collect 'obs-studio-*-windows-x64.zip' 'Windows-x64.zip'
          collect 'obs-studio-*-macos-apple.dmg' 'macOS-Apple.dmg'

          cp .github/fork-release/notes.md notes.md
          {
            echo
            echo '### Checksums (SHA-256)'
            echo
            for file in release/*; do
              echo "    ${file##*/}: $(sha256sum "${file}" | cut -d ' ' -f 1)"
            done
          } >> notes.md

      - name: Create Release 🛫
        run: |
          : Create Release 🛫
          set -euo pipefail
          gh release create "${RELEASE_TAG}" release/* \
            --target "${TARGET_SHA}" \
            --title "${RELEASE_TITLE}" \
            --notes-file notes.md \
            --prerelease
